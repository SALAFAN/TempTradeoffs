# Temporary Tradeoffs v0.1.5 example configuration
[triggers]
new_day = true
level_up = false
on_login = true
skip_login_if_active = false

[selection]
choices = 3
cooldown_days = 5
positive_weight_budget = 1000
negative_weight_budget = 1000
max_selection_weight = 1000
positive_effect_weights = []
negative_effect_weights = []
min_effects_per_side = 1
max_effects_per_side = 10

[pool]
vanilla_effects = true
vanilla_attributes = true
modded_effects = true
modded_attributes = true
craft_to_exile_2_integration = true

[interface]
freeze_while_choosing = true
hud_button = true

