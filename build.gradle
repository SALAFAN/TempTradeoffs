plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = '2.0.0'
group = 'com.warg.temptradeoffs'
base { archivesName = 'temptradeoffs' }

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods { temptradeoffs { source sourceSets.main } }
        }
        client { property 'forge.enabledGameTestNamespaces', 'temptradeoffs' }
        server { property 'forge.enabledGameTestNamespaces', 'temptradeoffs' }
        gameTestServer { property 'forge.enabledGameTestNamespaces', 'temptradeoffs' }
    }
}

repositories { }

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.2.0'
}

jar { finalizedBy 'reobfJar' }

publishing {
    publications { mavenJava(MavenPublication) { from components.java } }
    repositories { maven { url = uri("${project.projectDir}/mcmodsrepo") } }
}
